[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "presencebridge"
version = "0.1.0"
description = "Reversible presence adapters and a reproducible strict-tool schema audit"
requires-python = ">=3.9"
dependencies = ["jsonschema==4.25.1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
